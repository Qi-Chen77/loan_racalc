<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贷款重定价计算器</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main>
    <a class="github-link" href="https://github.com/Qi-Chen77/loan_racalc" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看项目">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.52-1.34-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.57-.29-5.27-1.28-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.18c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
    </a>
    <header>
      <p class="eyebrow">LOAN REPRICING</p>
      <h1>贷款重定价计算器</h1><p>基于实际日期、利率变更与现金流重新计算月供。</p>
    </header>
    <form id="calculator-form">
      <section><h2>贷款</h2><div class="grid">
        <label>剩余本金（EUR）<input name="principal" type="number" min="0.01" step="0.01" value="451200.37" required></label>
        <label>余额日期<input name="balanceDate" type="date" value="2026-06-22" required></label>
      </div></section>
      <section><h2>利率变更</h2><div class="grid three">
        <label>原利率（%）<input name="oldRate" type="number" min="0" step="0.001" value="4.278" required></label>
        <label>新利率（%）<input name="newRate" type="number" min="0" step="0.001" value="5.081" required></label>
        <label>新利率生效日<input name="effectiveDate" type="date" value="2026-07-20" required></label>
      </div></section>
      <section><h2>还款</h2><div class="grid three">
        <label>每月还款日<input name="paymentDay" type="number" min="1" max="31" step="1" value="21" required></label>
        <label>到期日<input name="maturityDate" type="date" value="2043-07-19" required></label>
        <div class="field"><div class="label-row"><label for="min-final-difference">末期差额下界（EUR）</label><button class="info-button" type="button" aria-label="末期差额下界说明" data-tooltip="实际绝对差额必须大于或等于此值">?</button></div><input id="min-final-difference" name="minFinalDifference" type="number" min="0" step="0.01" value="0" required></div>
        <div class="field"><div class="label-row"><label for="max-final-difference">末期差额上界（EUR）</label><button class="info-button" type="button" aria-label="末期差额上界说明" data-tooltip="实际绝对差额必须严格小于此值">?</button></div><input id="max-final-difference" name="maxFinalDifference" type="number" min="0.01" step="0.01" value="100" required></div>
      </div></section>
      <details><summary>高级设置</summary><div class="grid">
        <label>计息方式<select name="dayCount"><option>ACT/365</option><option>ACT/360</option></select></label>
        <label>工作日规则<select name="businessDayConvention"><option value="following">Following（顺延）</option><option value="unadjusted">Unadjusted（不调整）</option></select></label>
      </div></details>
      <button type="submit">计算新月供</button><p id="error" role="alert"></p>
    </form>
    <section id="results" hidden>
      <div class="hero-result"><span>新月供</span><strong id="monthly-payment"></strong><small>倒数第二期及之前的固定还款额</small></div>
      <div class="metrics" id="metrics"></div>
      <div class="table-heading"><div><p class="eyebrow">CASH FLOW</p><h2>完整还款表</h2></div><span id="row-count"></span></div>
      <div class="table-wrap"><table><thead><tr><th>合同还款日</th><th>实际还款日</th><th>期初本金</th><th>利息</th><th>还款额</th><th>偿还本金</th><th>期末本金</th></tr></thead><tbody id="schedule"></tbody></table></div>
    </section>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
